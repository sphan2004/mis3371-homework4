<html lang="en">
 
<head>
    <link rel="stylesheet" href="hw4.css">
    <title>We'R'Docs Medical Registration</title>
</head>
 
<body>
 
<header>
    <table width="100%">
        <tr>
            <td valign="top" align="left" width="20%">
                <div class="image">
                    <img src="medical-logo.webp" alt="Clinic Logo" width="70px" id="logo">
                </div>
            </td>
            <td align="center">
                <h2>We'R'Docs Medical</h2>
            </td>
            <td valign="bottom" align="right" width="20%">
                <p>Today's Date: <span id="today"></span></p>
            </td>
        </tr>
    </table>
</header>
 
<hr>
 
<!-- Welcome message: shown by JS if cookie exists -->
<center>
    <p id="welcome1"></p>
    <p id="welcome2"></p>
</center>
 
<!-- iFrame: Google Maps embed showing Houston area -->
<div class="iframe-container">
    <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d55800!2d-95.3698!3d29.7604!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8640b8b4488d8501%3A0xca0d02def365053b!2sHouston%2C%20TX!5e0!3m2!1sen!2sus!4v1699999999999!5m2!1sen!2sus"
        width="100%"
        height="300"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        frameborder="0">
    </iframe>
</div>
 
<form action="thankyou.html">
 
    <center>
        <div class="format">
 
            <table>
 
                <tr>
                    <th colspan="4">Create Account</th>
                </tr>
 
                <tr>
                    <td><label for="fname">First Name:</label></td>
                    <td>
                        <input type="text" name="fname" id="fname"
                            minlength="1" maxlength="30" required
                            title="Letters, apostrophes, and dashes only"
                            pattern="[a-zA-Z']{1,30}"
                            onblur="validateFname()"
                            placeholder="Steven">
                        <span class="error" id="fname-error"></span>
                    </td>
                </tr>
 
                <tr>
                    <td><label for="mini">Middle Initial:</label></td>
                    <td>
                        <input type="text" name="mini" id="mini"
                            maxlength="1" title="Letters only"
                            pattern="[a-zA-Z']{0,1}"
                            onblur="validateMini()"
                            placeholder="A">
                        <span class="error" id="mini-error"></span>
                    </td>
                </tr>
 
                <tr>
                    <td><label for="lname">Last Name:</label></td>
                    <td>
                        <input type="text" name="lname" id="lname"
                            minlength="1" maxlength="30" required
                            title="Letters, apostrophes, and dashes only"
                            pattern="[a-zA-Z']{1,30}"
                            onblur="validateLname()"
                            placeholder="Phan">
                        <span class="error" id="lname-error"></span>
                    </td>
                </tr>
 
                <tr>
                    <td><label>Gender:</label></td>
                    <td>
                        <input type="radio" id="g1" name="pgender" value="Male"> Male
                        <input type="radio" id="g2" name="pgender" value="Female"> Female
                        <input type="radio" id="g3" name="pgender" value="Other"> Other
                    </td>
                </tr>
 
                <tr>
                    <td><label for="dob">Date of Birth:</label></td>
                    <td>
                        <input type="date" id="dob" name="dob"
                            onblur="validateDob()" required>
                        <span class="error" id="dob-error"></span>
                    </td>
                </tr>
 
                <tr>
                    <td><label for="email">Email Address:</label></td>
                    <td>
                        <input type="email" id="email" name="email"
                            maxlength="50" required
                            title="Please enter your email address"
                            placeholder="you@example.com"
                            pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,20}$"
                            onblur="validateEmail()">
                        <span class="error" id="email-error"></span>
                    </td>
                </tr>
 
                <tr>
                    <td><label for="ssn">Social Security Number:</label></td>
                    <td>
                        <input type="password" id="ssn" name="ssn"
                            minlength="9" maxlength="11" required
                            title="Numbers only"
                            placeholder="123-45-6789"
                            onblur="validateSsn()">
                        <span class="error" id="ssn-error"></span>
                    </td>
                </tr>
 
                <tr>
                    <td><label for="phone">Phone Number:</label></td>
                    <td>
                        <input type="text" name="phone" id="phone"
                            pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required
                            title="Please enter phone number"
                            placeholder="123-456-7890"
                            onblur="validatePhone()">
                        <span class="error" id="phone-error"></span>
                    </td>
                </tr>
 
                <tr>
                    <td><label for="address1">Address Line 1:</label></td>
                    <td>
                        <input type="text" name="address1" id="address1"
                            minlength="2" maxlength="30" required
                            title="Please enter your address"
                            placeholder="1234 Address"
                            onblur="validateAddress1()">
                        <span class="error" id="address1-error"></span>
                    </td>
                </tr>
 
                <tr>
                    <td><label for="address2">Address Line 2:</label></td>
                    <td>
                        <input type="text" name="address2" id="address2"
                            minlength="2" maxlength="30"
                            title="Please enter your address"
                            placeholder="Apt, Suite, etc."
                            onblur="validateAddress2()">
                        <span class="error" id="address2-error"></span>
                    </td>
                </tr>
 
                <tr>
                    <td><label for="city">City:</label></td>
                    <td>
                        <input type="text" name="city" id="city"
                            maxlength="30" required
                            placeholder="Your City"
                            onblur="validateCity()">
                        <span class="error" id="city-error"></span>
                    </td>
                </tr>
 
                <tr>
                    <td class="td1"><label for="state">State:</label></td>
                    <td>
                        <!-- Populated by Fetch API from states.json -->
                        <select name="state" id="state" required>
                            <option selected disabled>Loading states...</option>
                        </select>
                    </td>
                </tr>
 
                <tr>
                    <td><label for="zcode">Zip Code:</label></td>
                    <td>
                        <input type="text" name="zcode" id="zcode"
                            minlength="5" maxlength="10" required
                            title="Numbers and a dash only"
                            placeholder="12345"
                            pattern="^\d{5}(-\d{4})?$"
                            onblur="validateZcode()">
                        <span class="error" id="zcode-error"></span>
                    </td>
                </tr>
 
                <tr>
                    <td><label>Have you ever had:</label></td>
                    <td>
                        <input type="checkbox" id="option1" name="chickenPox" value="Chicken Pox"> Chicken Pox
                        <input type="checkbox" id="option2" name="flu" value="Flu"> Flu
                        <input type="checkbox" id="option3" name="diabetes" value="Diabetes"> Diabetes
                        <input type="checkbox" id="option4" name="asthma" value="Asthma"> Asthma
                    </td>
                </tr>
 
                <tr>
                    <td><label for="notes">Additional Notes:</label></td>
                    <td>
                        <textarea id="notes" name="notes" rows="4" cols="35"
                            placeholder="Enter any additional medical history or concerns here..."
                            onblur="saveToLocalStorage('notes', this.value)"></textarea>
                    </td>
                </tr>
 
                <tr>
                    <td class="td1"><label for="range">How is your health?<br/>(Rate from 1 to 10)</label></td>
                    <td>
                        <input type="range" name="range" id="range"
                            min="1" max="10" value="5"
                            oninput="document.getElementById('range-slider').innerText = this.value; saveToLocalStorage('range', this.value)">
                        <span id="range-slider">5</span>
                    </td>
                </tr>
 
                <tr>
                    <td class="td1"><label for="uid">User ID:</label></td>
                    <td>
                        <input type="text" name="uid" id="uid"
                            maxlength="20" required
                            title="Please enter a user ID"
                            placeholder="Your user ID"
                            onblur="validateUid()">
                        <span class="error" id="uid-error"></span>
                    </td>
                </tr>
 
                <tr>
                    <td><label for="pword">Password:</label></td>
                    <td>
                        <input type="password" name="pword" id="pword"
                            minlength="10" required
                            onblur="validatePword()"
                            oninput="validatePword()"
                            onfocus="validatePword()">
                        <span class="error" id="pword-error"></span>
                    </td>
                </tr>
 
                <tr>
                    <td><label for="pword_confirm">Re-enter Password:</label></td>
                    <td>
                        <input type="password" name="pword_confirm" id="pword_confirm"
                            minlength="10" required
                            placeholder="Re-enter your password"
                            onblur="validatePwordConfirm()"
                            oninput="validatePwordConfirm()"
                            onfocus="validatePwordConfirm()">
                        <span class="error" id="pword_confirm-error"></span>
                    </td>
                </tr>
 
                <!-- Remember Me — inside the table where it belongs -->
                <tr>
                    <td class="td1"><label for="remember-me">Remember Me:</label></td>
                    <td>
                        <input type="checkbox" id="remember-me" name="remember-me" checked>
                    </td>
                </tr>
 
                <!-- Action buttons -->
                <tr>
                    <td colspan="4">
                        <center>
                            <input type="button" name="review" id="review" value="Review" onclick="reviewInput()">
                            <input type="submit" name="submit" id="submit" value="Submit">
                            <input type="reset" name="reset" value="Reset" onclick="clearLocalStorage()">
                        </center>
                    </td>
                </tr>
 
                <!-- Password hint messages -->
                <tr>
                    <td colspan="4">
                        <div class="pword-message">
                            <span id="msg1"></span><br/>
                            <span id="msg2"></span><br/>
                            <span id="msg3"></span><br/>
                            <span id="msg4"></span><br/>
                        </div>
                    </td>
                </tr>
 
                <!-- Review output -->
                <tr>
                    <td colspan="4">
                        <center>
                            <p id="showInput"></p>
                        </center>
                    </td>
                </tr>
 
            </table>
 
        </div>
    </center>
 
</form>
 
<!-- Alert overlay — position:fixed, lives outside form/table -->
<div id="alert-box">
    <div id="alert-content">
        <h4>Please fill out all required fields.</h4>
        <button id="close-alert">OK</button>
    </div>
</div>
 
<!-- Footer — position:fixed keeps it pinned while scrolling -->
<footer>
    <p>&#169; We'R'Docs Medical &nbsp;|&nbsp; <a href="contact.html">Contact Us!</a></p>
</footer>
 
<script src="hw4.js"></script>
 
</body>
</html>
